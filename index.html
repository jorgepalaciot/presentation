  (function () {
    var stored = localStorage.getItem("jpt-lang");
    var lang = stored;
    if (!lang) {
      var nav = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      lang = nav.indexOf("es") === 0 ? "es" : "en";
    }
    window.location.replace(lang + "/");
  })();
</script>
